<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iLourSari Lourdes Sari Sari Store</title>
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="image/store.ico" type="image/fav.ico">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    <div class="login-container">
        <div class="login-illustration">
            <div class="illustration-placeholder">
                <i class="fas fa-briefcase"></i>
            </div>
        </div>

        <div class="login-form-container">
            <div class="logo-section">
                <div class="logo-icon">
                    <i class="fas fa-bag-shopping"></i>
                </div>
                <span class="logo-text">iLourSari Lourdes Sari Sari Store</span>
            </div>

            <h1>Admin Login</h1>
            <p class="subtitle">Login in your admin account</p>

            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <div class="input-wrapper">
                        <i class="fa-regular fa-envelope input-icon"></i>
                        <input 
                            type="email" 
                            id="email" 
                            name="email" 
                            placeholder="Enter your email address"
                            required
                        >
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock input-icon"></i>
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            placeholder="Enter your password"
                            required
                        >
                        <button 
                            type="button" 
                            class="password-toggle" 
                            id="passwordToggle"
                            aria-label="Toggle password visibility"
                        >
                            <i class="fa-regular fa-eye-slash"></i>
                        </button>
                    </div>
                </div>

                <div class="form-footer">
                    <div class="checkbox-wrapper">
                        <input 
                            type="checkbox" 
                            id="rememberMe" 
                            name="rememberMe"
                        >
                        <label for="rememberMe">Remember Me</label>
                    </div>
                    <a href="#" class="forgot-password">Forgot Password</a>
                </div>

                <button type="submit" class="login-btn">
                    <span>Login</span>
                    <i class="fa-solid fa-arrow-right"></i>
                </button>
            </form>
        </div>
    </div>
    <script src="script.js"></script>
    
</body>
</html>
